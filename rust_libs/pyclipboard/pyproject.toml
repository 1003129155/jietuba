[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "j-clipboard"
version = "0.4.0"
description = "Windows clipboard access and history management for Python, implemented in Rust (text/image/HTML/RTF/files, SQLite-backed)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["clipboard", "clipboard-history", "windows", "rust", "pyo3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]

[tool.maturin]
# 发行名是 j-clipboard，import 名保持 pyclipboard 不变
module-name = "pyclipboard"
features = ["pyo3/extension-module"]
