[package]
name = "pyclipboard"
version = "0.4.7"
edition = "2021"
license = "MIT"
description = "剪贴板读写与历史管理"
authors = ["JYAARU"]

[dependencies]
# 剪贴板操作
clipboard-rs = "0.3.5"

# SQLite 数据库（bundled 表示自带 SQLite）
rusqlite = { version = "0.32", features = ["bundled"] }

# 序列化
serde.workspace = true
serde_json.workspace = true

# 工具库
sha2 = "0.10"
chrono = "0.4"
once_cell = "1.18.0"
parking_lot = "0.12"
dirs = "5.0"
base64 = "0.22"

# 图片处理
image.workspace = true

# zstd 压缩（用于超过 100KB 的格式数据）
zstd = "0.13"
