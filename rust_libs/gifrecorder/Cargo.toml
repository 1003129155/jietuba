[package]
name = "gifrecorder"
version = "0.4.1"
edition = "2021"
license = "MIT"
description = "GIF screen recording: capture → JPEG compress → store → decode → GIF export"

[dependencies]

# DXGI 录制区域采集，HDR 屏上按固定映射转 sRGB
hdrcapture = { path = "../hdrcapture" }

# JPEG 编解码 (纯 Rust, 无需 NASM / libjpeg-turbo)
jpeg-encoder = "0.6"

# GIF 低层编码（帧差分 + NeuQuant 量化）
gif = "0.13"
color_quant = "1.1"

# 图像处理 + JPEG 解码 (zune-jpeg)
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# 高质量快速 resize
fast_image_resize = "5"

# 并行帧处理
rayon = "1.7"

# 有界 channel (decoder ↔ 调用方)
crossbeam-channel = "0.5"
