[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "j-ppocr"
version = "0.2.0"
description = "PP-OCR ONNX inference for Python via Rust (det+rec, no opencv/numpy)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Rust 依赖被静态链接进 .pyd，随分发附上它们的版权声明与许可全文
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.txt"]
authors = [{ name = "JYAARU" }]
keywords = ["ocr", "paddleocr", "ppocr", "onnx", "text-recognition"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "ppocr_rust"
