[package]
name = "ppocr_rust"
version = "0.1.1"
edition = "2021"
authors = ["MoSheng"]
description = "PP-OCR (PaddleOCR) ONNX inference for Python via Rust + ort (det+rec, no opencv/numpy)"

[lib]
name = "ppocr_rust"
crate-type = ["rlib", "cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
ort = { version = "=2.0.0-rc.12", features = ["ndarray"] }
ndarray = "0.16"
image = { version = "0.25", default-features = false }
imageproc = "0.25"
