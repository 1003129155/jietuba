[package]
name = "ppocr_rust"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
authors = ["JYAARU"]
description = "PP-OCR (PaddleOCR) ONNX inference via Rust + ort (det+rec, no opencv/numpy)"

[features]
# ONNX Runtime 不静态链接，运行时由 engine::init_runtime 从给定路径加载（C++ 版用）
load-dynamic = ["ort/load-dynamic"]

[dependencies]
ort = { version = "=2.0.0-rc.12", features = ["ndarray"] }
ndarray = "0.16"
image = { version = "0.25", default-features = false }
imageproc = "0.25"
serde = { workspace = true }
serde_json = { workspace = true }
