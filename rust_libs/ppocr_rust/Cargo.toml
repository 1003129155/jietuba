[package]
name = "ppocr_rust"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
authors = ["JYAARU"]
description = "PP-OCR (PaddleOCR) ONNX inference via Rust + ort (det+rec, no opencv/numpy)"

[features]
# ONNX Runtime 不静态链接，运行时由 engine::init_runtime 从给定路径加载（C++ 版用）
load-dynamic = ["ort/load-dynamic"]

[dependencies]
# 不要默认的 copy-dylibs：ORT 静态链接，用不到它复制的 DirectML.dll；Cargo 1.100 的新 build 目录布局下它会找错目录而编译失败
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-native", "api-24"] }
ndarray = "0.16"
image = { version = "0.25", default-features = false }
imageproc = "0.25"
serde = { workspace = true }
serde_json = { workspace = true }
