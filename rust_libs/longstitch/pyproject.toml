[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "j-stitch"
version = "0.4.0"
description = "Scrolling screenshot stitching for Python, implemented in Rust (row-hash + LCS overlap detection)"
readme = "README.md"
license = "MIT"
# Rust 依赖被静态链接进 .pyd，随分发附上它们的版权声明与许可全文
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.txt"]
# Rust 依赖静态链接进 .pyd，随分发附上它们的版权声明与许可全文
authors = [{ name = "JYAARU" }]
requires-python = ">=3.11"
keywords = ["screenshot", "stitching", "scrolling-capture", "image", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]

[tool.maturin]
# 发行名是 j-stitch，import 名保持 longstitch 不变
module-name = "longstitch"
