[package]
name = "jietuba-updater"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
thiserror = "2"
fs2 = "0.4"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "jietuba_updater"
path = "src/main.rs"
