[package]
name = "hdrcapture"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "HDR 正确的 Windows 桌面截图：DXGI Desktop Duplication + GPU tone-map，输出 sRGB BGRA8"
authors = ["JYAARU"]

[lib]
name = "hdrcapture"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }

# Windows API：只保留 DXGI Desktop Duplication + D3D11 + DisplayConfig 所需。
# 上游 30 项 feature 中 WinRT/WGC/媒体编码那部分随模块一并裁除（见 README）。
windows = { version = "0.62.2", features = [
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_HiDpi",
] }

# 跨 GPU 时虚拟桌面退化为 CPU 拼接，该路径按行并行
rayon = "1.12"
thiserror = "2.0"
