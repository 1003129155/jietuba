name: Build Rust Wheels

# 保证四个 Rust 包随时能从 rust_libs/ 的源码重新构建出来，并跑 Rust 侧的单元测试
# 与第三方许可声明复查。正式发布走 publish-pypi.yml；这个 workflow 只做验证，
# 不产出任何对外分发的东西。
# 主 CI 不跑这个（ONNX Runtime、rusqlite bundled、zstd 都要编 C，太慢），
# 只在 Rust 源码真的改动时触发。
on:
  push:
    branches: [master2, master]
    paths:
      - "rust_libs/**"
      - ".github/workflows/rust-wheels.yml"
  pull_request:
    paths:
      - "rust_libs/**"
      - ".github/workflows/rust-wheels.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            python-architecture: x64
            python-machine: amd64
            rust-target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            python-architecture: arm64
            python-machine: arm64
            rust-target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        # 四个包是 abi3 wheel，用 3.11 作为最低版本构建
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-architecture }}

      - name: Record toolchain versions
        # 构建产物无法做到 bit 级可复现，但至少要让日志记下用的是哪套工具链
        run: |
          rustc -V
          cargo -V
          python -V
          python -c "import platform; actual = platform.machine().lower(); expected = '${{ matrix.python-machine }}'; assert actual == expected, f'Python architecture {actual!r} != {expected!r}'"
          $hostLine = rustc -vV | Select-String '^host:'
          if ($hostLine -notmatch '${{ matrix.rust-target }}') {
            throw "Rust host does not match ${{ matrix.rust-target }}: $hostLine"
          }

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_libs
          # 整轮构建十分钟起步，失败时若不存 cache，下次又得从零编一遍共享依赖
          cache-on-failure: true

      - name: Run Rust unit tests
        # 主 CI 只跑 Python 测试，Rust 侧的单元测试没有别的地方会执行。
        # 放在构建 wheel 之前：逻辑错了就不必再花时间打包。
        run: cargo test --locked --workspace --release --target ${{ matrix.rust-target }} --manifest-path rust_libs/Cargo.toml

      - name: Install cargo-about
        if: matrix.arch == 'x64'
        # 0.9 起二进制需要显式启用 cli feature 才会被安装
        run: cargo install cargo-about --locked --features cli

      - name: Check third-party notices are current
        if: matrix.arch == 'x64'
        # 四个 wheel 把 Rust 依赖静态链接进 .pyd，MIT/BSD/ISC 等都要求随分发
        # 附上版权声明与许可全文。声明文件提交在仓库里，依赖一变就会过期，
        # 而本 workflow 恰好只在 rust_libs/** 改动时触发，正是该复查的时机。
        #
        # 比的是依赖清单而非文件字节：cargo about 的块顺序在不同机器上不稳定，
        # 按字节比会误判。而 crates.io 上同一版本的内容不可变，所以
        # 「哪个 crate 的哪个版本用哪个许可证」这份清单一致，就等价于声明未过期。
        run: |
          $stale = $false
          foreach ($crate in "gifrecorder", "longstitch", "pyclipboard", "ppocr_rust") {
            $fresh = Join-Path $env:RUNNER_TEMP "$crate-notices.txt"
            cargo about generate --manifest-path rust_libs/$crate/Cargo.toml -o $fresh rust_libs/notices.hbs
            if ($LASTEXITCODE -ne 0) { throw "$crate 的许可声明生成失败" }
            $committed = (Select-String -Path "rust_libs/$crate/THIRD-PARTY-NOTICES.txt" -Pattern '^Applies to: ').Line | Sort-Object
            $current = (Select-String -Path $fresh -Pattern '^Applies to: ').Line | Sort-Object
            $diff = Compare-Object $committed $current
            if ($diff) {
              $stale = $true
              Write-Host "::error::$crate 的第三方许可声明已过期"
              $diff | ForEach-Object {
                $where = if ($_.SideIndicator -eq "<=") { "已提交但依赖树中已无" } else { "依赖树中新增但未声明" }
                Write-Host "    $where : $($_.InputObject)"
              }
            }
          }
          if ($stale) {
            Write-Host "重新生成的方法见 rust_libs/PUBLISHING.md"
            exit 1
          }
          Write-Host "四个包的第三方许可声明均为最新"

      - name: Install maturin
        # 版本与 requirements-dev.txt 保持一致
        run: pip install maturin==1.12.6

      - name: Build wheels
        # 四个 crate 同属一个 workspace，共用一个 target/ 目录，
        # pyo3/image/rayon 这些共享依赖只编译一次。
        run: |
          foreach ($crate in "gifrecorder", "longstitch", "pyclipboard", "ppocr_rust") {
            Write-Host "::group::build $crate"
            maturin build --locked --release --target ${{ matrix.rust-target }} -i python -m rust_libs/$crate/Cargo.toml --out wheelhouse
            if ($LASTEXITCODE -ne 0) { throw "$crate 构建失败" }
            Write-Host "::endgroup::"
          }
          Get-ChildItem wheelhouse\*.whl | Select-Object Name, Length

      - name: Smoke-test native wheels
        run: |
          python -m pip install (Get-ChildItem wheelhouse\*.whl).FullName
          python -c "import gifrecorder, longstitch, pyclipboard, ppocr_rust; print('Native extension imports OK')"

      - name: Upload wheels
        # 供人工下载核查用；正式发布走 publish-pypi.yml，不依赖这份 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
