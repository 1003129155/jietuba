name: C++

# The C++ version (cpp/) built against this commit's rust_libs, with the tests that need no
# desktop. Not a required check, so path filters are enough.
on:
  workflow_dispatch:
  push:
    branches: [master2]
    paths: ["cpp/**", "rust_libs/**", ".github/workflows/cpp.yml"]
  pull_request:
    branches: [master2]
    paths: ["cpp/**", "rust_libs/**", ".github/workflows/cpp.yml"]

permissions:
  contents: read

defaults:
  run:
    # The build scripts target Windows PowerShell 5.1, as on developer machines.
    shell: powershell
    working-directory: cpp

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - id: qt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpp/.sdk/6.11.0/msvc2022_64
          key: qt-6.11.0-x64-${{ hashFiles('cpp/scripts/install_qt.py') }}

      - if: steps.qt.outputs.cache-hit != 'true'
        run: |
          python -m pip install py7zr
          python scripts\install_qt.py
          if ($LASTEXITCODE -ne 0) { throw "Qt SDK download failed" }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cpp/native -> ../build/msvc/native
          save-if: ${{ github.ref == 'refs/heads/master2' }}

      - run: .\build.cmd -SkipTests

      # Tests on the real desktop (-platform windows) inject input, register hotkeys and capture
      # the screen; they are run on developer machines.
      - run: |
          $env:PATH = "$PWD\.sdk\6.11.0\msvc2022_64\bin;$env:PATH"
          ctest --test-dir build\msvc -C Release --output-on-failure -E "_desktop$|_windows_parity$"
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }

      # ctest does not show QtTest's own report; run each failed test again with it written to a file.
      - if: failure()
        run: |
          $env:PATH = "$PWD\.sdk\6.11.0\msvc2022_64\bin;$env:PATH"
          $tests = (ctest --test-dir build\msvc -C Release --show-only=json-v1 | ConvertFrom-Json).tests
          foreach ($line in Get-Content build\msvc\Testing\Temporary\LastTestsFailed.log -ErrorAction SilentlyContinue) {
            $name = ($line -split ':', 2)[1]
            $test = $tests | Where-Object { $_.name -eq $name }
            if (-not $test) { continue }
            foreach ($property in $test.properties | Where-Object { $_.name -eq 'ENVIRONMENT' }) {
              foreach ($pair in $property.value) { $key, $value = $pair -split '=', 2; Set-Item "env:$key" $value }
            }
            $report = Join-Path $env:RUNNER_TEMP "$name.txt"
            $testArgs = @($test.command | Select-Object -Skip 1) + @('-o', "$report,txt")
            & $test.command[0] @testArgs | Out-Null
            Write-Host "===== $name (exit $LASTEXITCODE)"
            Get-Content $report -ErrorAction SilentlyContinue
          }
