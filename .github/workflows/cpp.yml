name: C++

# The C++ version (cpp/) built against this commit's rust_libs, with its tests and line coverage.
# Its `test` job is the required check of master2, so pull requests run it whatever they touch:
# with a path filter, a pull request outside these folders would wait for it forever.
on:
  workflow_dispatch:
  push:
    branches: [master2]
    paths: ["cpp/**", "rust_libs/**", ".github/workflows/cpp.yml"]
  pull_request:
    branches: [master2]

permissions:
  contents: read

defaults:
  run:
    # The build scripts target Windows PowerShell 5.1, as on developer machines.
    shell: powershell
    working-directory: cpp

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # diff-cover compares against the base branch.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - id: qt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpp/.sdk/6.11.0/msvc2022_64
          key: qt-6.11.0-x64-${{ hashFiles('cpp/scripts/install_qt.py') }}

      - if: steps.qt.outputs.cache-hit != 'true'
        run: |
          python -m pip install py7zr
          python scripts\install_qt.py
          if ($LASTEXITCODE -ne 0) { throw "Qt SDK download failed" }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cpp/native -> ../build/coverage-build/native
          save-if: ${{ github.ref == 'refs/heads/master2' }}

      - name: Install coverage tools
        run: |
          python -m pip install diff-cover==9.7.2
          if ($LASTEXITCODE -ne 0) { throw "diff-cover install failed" }
          # Visual Studio Enterprise ships the collector; dotnet-coverage is the same one as a tool.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not (Get-ChildItem "$vs\Common7\IDE\Extensions\Microsoft\CodeCoverage.Console" -Filter Microsoft.CodeCoverage.Console.exe -Recurse -ErrorAction SilentlyContinue)) {
            dotnet tool install --global dotnet-coverage
            if ($LASTEXITCODE -ne 0) { throw "dotnet-coverage install failed" }
          }

      # The PP-OCR cases run on the default models in the repository and the catalog's ONNX Runtime;
      # CMake takes the folder from JIETUBA_PPOCR_MODELS. The fetch checks the cached DLL's hash.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpp/build/ort/x64
          key: ort-x64-${{ hashFiles('rust_libs/ppocr_rust/catalog.json') }}

      - name: PP-OCR pack
        run: |
          $pack = Join-Path $PWD 'build\ppocr-pack'
          New-Item -ItemType Directory -Path $pack -Force | Out-Null
          $dll = .\scripts\fetch_ort_runtime.ps1 -Arch x64 -OutDir build\ort\x64
          Copy-Item -LiteralPath $dll, ..\models\PP-OCRv6_det_small.onnx, ..\models\PP-OCRv6_rec_small.onnx -Destination $pack
          "JIETUBA_PPOCR_MODELS=$pack" | Add-Content $env:GITHUB_ENV

      # One unoptimised build serves both the tests and the coverage; the release packages are
      # built by the Lite single exe workflow.
      - id: build
        run: .\scripts\coverage.ps1 -BuildOnly

      - id: tests
        # Four at a time on the runner's four cores; the clipboard tests take turns (RESOURCE_LOCK).
        run: .\scripts\coverage.ps1 -SkipBuild -Jobs 4 -TestExclude '_desktop$|_windows_parity$'

      # ctest does not show QtTest's own report; run each failed test again with it written to a file.
      - if: failure() && steps.tests.outcome == 'failure'
        run: .\scripts\show_failed_tests.ps1

      # Tests on the real desktop (-platform windows) inject input, register hotkeys and capture
      # the screen. The runner's interactive session runs them for their coverage; they stay
      # required on developer machines, and a failure here does not fail the check.
      - id: desktop
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: .\scripts\coverage.ps1 -SkipBuild -Append -TestFilter '_desktop$|_windows_parity$'

      - if: always() && steps.desktop.outcome == 'failure'
        continue-on-error: true
        run: .\scripts\show_failed_tests.ps1

      # A ratchet on the whole of cpp/src: raise it as tests are added, never lower it. Changed
      # lines need 75%, and a changed source file no test runs at all fails.
      - name: Coverage gates
        if: always() && steps.build.outcome == 'success'
        run: |
          $reports = @(Get-ChildItem build\coverage\raw -Filter *.xml | ForEach-Object FullName)
          $gate = @('--fail-under', '77')
          if ('${{ github.event_name }}' -eq 'pull_request') { $gate += @('--changed-since', 'origin/${{ github.base_ref }}') }
          python scripts\coverage_report.py @reports --out build\coverage\coverage.xml --summary build\coverage\summary.txt @gate
          $failed = $LASTEXITCODE -ne 0
          if ('${{ github.event_name }}' -eq 'pull_request') {
            Push-Location ..
            diff-cover cpp\build\coverage\coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=75 --format "markdown:cpp/build/coverage/diff-coverage.md"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Pop-Location
            Get-Content build\coverage\diff-coverage.md -ErrorAction SilentlyContinue | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content build\coverage\summary.txt -Tail 1 | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($failed) { throw "Coverage gate failed" }

      - if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            cpp/build/coverage/coverage.xml
            cpp/build/coverage/summary.txt
          if-no-files-found: ignore
