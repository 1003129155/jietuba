name: Publish to PyPI

# 发布是不可逆的：PyPI 上的包名与版本号发出去撤不回，同一版本也不能重传。
# 因此本 workflow 只能手动触发，且默认指向 TestPyPI；正式发布必须显式选择。
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "发布目标"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        # 四个包是 abi3 wheel，用 3.11 作为最低版本构建
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_libs
          cache-on-failure: true

      - name: Install maturin
        run: pip install maturin==1.12.6

      - name: Build wheels
        # 从源码重新构建，不用 wheels/ 里已提交的那份——发布出去的产物
        # 必须能追溯到本次 commit 的源码
        run: |
          foreach ($crate in "gifrecorder", "longstitch", "pyclipboard", "ppocr_rust") {
            maturin build --release -i python -m rust_libs/$crate/Cargo.toml --out dist
            if ($LASTEXITCODE -ne 0) { throw "$crate 构建失败" }
          }
          Get-ChildItem dist\*.whl | Select-Object Name, Length

      - name: Verify metadata
        # twine check 能在上传前发现描述渲染失败一类的问题，
        # 而这类问题在 PyPI 上是改不了的（同一版本不能重传）
        run: |
          pip install twine
          twine check dist/*.whl

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # 每个包在 PyPI 上是独立项目，需各自配置 Trusted Publisher，
    # 所以按包分开上传，一个失败不影响其余已成功的
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: j-gif
            pattern: j_gif-*.whl
          - package: j-stitch
            pattern: j_stitch-*.whl
          - package: j-clipboard
            pattern: j_clipboard-*.whl
          - package: j-ppocr
            pattern: j_ppocr-*.whl
    environment:
      name: ${{ inputs.repository }}
    permissions:
      # Trusted Publishing 用 OIDC 换取上传令牌，不需要在 secrets 里存 API token
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Keep only this package
        run: |
          mkdir -p upload
          mv dist/${{ matrix.pattern }} upload/
          ls -l upload

      - name: Publish ${{ matrix.package }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          repository-url: ${{ inputs.repository == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          print-hash: true
