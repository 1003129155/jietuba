name: CI

on:
  push:
    branches: [master2, master]
  pull_request:
    branches: [master2, master]

jobs:
  test:
    runs-on: windows-latest
    env:
      # PySide6 GUI 组件在无桌面会话的 CI Runner 上需要离屏渲染
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install custom Rust wheels
        run: |
          pip install gifrecorder-0.2.1-cp311-cp311-win_amd64.whl `
                      longstitch-0.3.11-cp311-cp311-win_amd64.whl `
                      pyclipboard-0.3.14-cp311-cp311-win_amd64.whl `
                      ppocr_rust-0.1.1-cp311-cp311-win_amd64.whl

      - name: Run test suite
        working-directory: main/tests
        run: pytest . -v
