name: Build Release

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            python-architecture: x64
            python-machine: amd64
            rust-target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            python-architecture: arm64
            python-machine: arm64
            rust-target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      # Runner 控制台默认编码是 cp1252，打包脚本的中文 print() 会导致
      # UnicodeEncodeError；强制 Python 用 UTF-8 处理标准输出。
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-architecture }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify native toolchain architecture
        run: |
          python -c "import platform; actual = platform.machine().lower(); expected = '${{ matrix.python-machine }}'; assert actual == expected, f'Python architecture {actual!r} != {expected!r}'"
          $hostLine = rustc -vV | Select-String '^host:'
          if ($hostLine -notmatch '${{ matrix.rust-target }}') {
            throw "Rust host does not match ${{ matrix.rust-target }}: $hostLine"
          }

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_libs
          cache-on-failure: true

      - name: Build Rust wheels from this release
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.12.6
          foreach ($crate in "gifrecorder", "longstitch", "pyclipboard", "ppocr_rust", "hdrcapture") {
            maturin build --locked --release --target ${{ matrix.rust-target }} -i python -m rust_libs/$crate/Cargo.toml --out wheelhouse
            if ($LASTEXITCODE -ne 0) { throw "$crate wheel build failed" }
          }
          python -m pip install (Get-ChildItem wheelhouse\*.whl).FullName
          python -c "import gifrecorder, longstitch, pyclipboard, ppocr_rust, hdrcapture; print('Native extension imports OK')"

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Build onefile exe with PyInstaller
        run: python build_with_ocr_onefile.py

      - name: Add license notices
        # 发布包里静态编入了第三方 Rust 代码（含 windows-capture 的 MIT 代码），随包附上版权声明与许可
        run: |
          New-Item -ItemType Directory -Force dist\licenses | Out-Null
          Copy-Item LICENSE dist\licenses\LICENSE.txt
          foreach ($crate in "gifrecorder", "longstitch", "pyclipboard", "ppocr_rust", "hdrcapture") {
            Copy-Item rust_libs\$crate\THIRD-PARTY-NOTICES.txt dist\licenses\$crate-THIRD-PARTY-NOTICES.txt
          }
          Copy-Item rust_libs\hdrcapture\LICENSE-UPSTREAM dist\licenses\windows-capture-LICENSE.txt

      - name: Package dist as zip
        run: Compress-Archive -Path dist\* -DestinationPath jietuba_pp-${{ github.ref_name }}-${{ matrix.arch }}.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jietuba_pp-${{ github.ref_name }}-${{ matrix.arch }}
          path: jietuba_pp-${{ github.ref_name }}-${{ matrix.arch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jietuba_pp-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
          # 先建草稿：发布说明审过、发布包验过之后再公开
          draft: true
